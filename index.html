<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위드해피 보드게임 아카이브</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --sub-text: #6c757d;
            --primary: #4a90e2;
            --border-color: #e9ecef;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .guestbook-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-top: 30px;
        }

        .guestbook-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .guestbook-form input, 
        .guestbook-form textarea {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .guestbook-form input {
            width: 200px;
        }

        .guestbook-form textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            align-self: flex-end;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #357abd;
        }

        .guestbook-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .guestbook-item {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            background-color: #fff;
        }

        .guestbook-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .guestbook-author {
            font-weight: bold;
        }

        .guestbook-date {
            color: var(--sub-text);
            font-size: 12px;
        }

        .guestbook-message {
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .gb-action-btn.del {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎲 위드해피 보드게임 아카이브</h1>
    </div>

    <!-- 방명록 섹션 -->
    <div class="guestbook-section">
        <h2>💌 방명록</h2>
        <div class="guestbook-form">
            <div class="form-row">
                <input type="text" id="gbName" placeholder="작성자 이름" maxlength="10">
            </div>
            <textarea id="gbMessage" placeholder="방명록 메시지를 남겨주세요!"></textarea>
            <button class="btn-submit" onclick="addGuestbookEntry()">등록하기</button>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

        <div id="guestbookList" class="guestbook-list">
            <!-- 방명록 목록이 생성되는 영역 -->
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        loadGuestbook();
    });

    function addGuestbookEntry() {
        const nameInput = document.getElementById("gbName");
        const msgInput = document.getElementById("gbMessage");

        if (!nameInput.value.trim() || !msgInput.value.trim()) {
            alert("이름과 내용을 모두 입력해주세요!");
            return;
        }

        const newEntry = {
            id: Date.now(),
            name: nameInput.value.trim(),
            message: msgInput.value.trim(),
            date: new Date().toLocaleDateString("ko-KR")
        };

        const entries = JSON.parse(localStorage.getItem("guestbookEntries") || "[]");
        entries.unshift(newEntry);
        localStorage.setItem("guestbookEntries", JSON.stringify(entries));

        nameInput.value = "";
        msgInput.value = "";
        loadGuestbook();
    }

    function loadGuestbook() {
        const listContainer = document.getElementById("guestbookList");
        if (!listContainer) return;

        const entries = JSON.parse(localStorage.getItem("guestbookEntries") || "[]");

        if (entries.length === 0) {
            listContainer.innerHTML = "<p style='color: var(--sub-text); text-align: center;'>첫 방명록을 남겨보세요! 💌</p>";
            return;
        }

        listContainer.innerHTML = entries.map(item => `
            <div class="guestbook-item">
                <div class="guestbook-item-header">
                    <span class="guestbook-author">👤 ${escapeHtml(item.name)}</span>
                    <span class="guestbook-date">${item.date} 
                        <button class="gb-action-btn del" onclick="deleteGuestbookEntry(${item.id})">삭제</button>
                    </span>
                </div>
                <div class="guestbook-message">${escapeHtml(item.message)}</div>
            </div>
        `).join("");
    }

    function deleteGuestbookEntry(id) {
        if (!confirm("이 방명록을 삭제하시겠습니까?")) return;
        let entries = JSON.parse(localStorage.getItem("guestbookEntries") || "[]");
        entries = entries.filter(item => item.id !== id);
        localStorage.setItem("guestbookEntries", JSON.stringify(entries));
        loadGuestbook();
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
