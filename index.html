<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위드해피 보드게임</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; color: #333; }
        h1, h2 { text-align: center; }
        .boardgame-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
        .card h3 { margin: 10px 0 5px; }
        
        .guestbook-section { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .guestbook-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .guestbook-form input, .guestbook-form textarea { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .guestbook-form button { padding: 10px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .entry { border-bottom: 1px solid #eee; padding: 12px 0; }
        .entry .name { font-weight: bold; color: #007bff; margin-bottom: 4px; }
        .entry .date { font-size: 11px; color: #999; margin-top: 4px; }
    </style>
</head>
<body>

    <h1>🎮 위드해피 보드게임 갤러리</h1>

    <!-- 보드게임 목록 섹션 -->
    <div class="boardgame-container">
        <div class="card">
            <img src="https://via.placeholder.com/250x180?text=Board+Game+1" alt="게임 이미지">
            <h3>보드게임 제목 1</h3>
            <p>설명 또는 라벨 정보</p>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/250x180?text=Board+Game+2" alt="게임 이미지">
            <h3>보드게임 제목 2</h3>
            <p>설명 또는 라벨 정보</p>
        </div>
    </div>

    <!-- 방명록 섹션 -->
    <div class="guestbook-section">
        <h2>📝 실시간 방명록</h2>
        <div class="guestbook-form">
            <input type="text" id="username" placeholder="작성자 이름">
            <textarea id="message" rows="3" placeholder="메시지를 남겨주세요"></textarea>
            <button onclick="addEntry()">남기기</button>
        </div>
        <div id="guestbook-entries"></div>
    </div>

    <script>
        const SERVER_URL = "https://jsonbin.org/me/guestbook";

        async function loadEntries() {
            try {
                const res = await fetch(SERVER_URL);
                if (res.ok) {
                    const data = await res.json();
                    renderEntries(data);
                }
            } catch (e) {
                console.error("로드 실패:", e);
            }
        }

        async function addEntry() {
            const name = document.getElementById("username").value.trim();
            const message = document.getElementById("message").value.trim();

            if (!name || !message) {
                alert("이름과 메시지를 입력하세요.");
                return;
            }

            const newEntry = { name, message, date: new Date().toLocaleString() };

            try {
                const res = await fetch(SERVER_URL);
                let entries = res.ok ? await res.json() : [];
                if (!Array.isArray(entries)) entries = [];

                entries.unshift(newEntry);

                await fetch(SERVER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(entries)
                });

                document.getElementById("username").value = "";
                document.getElementById("message").value = "";
                renderEntries(entries);
            } catch (e) {
                alert("저장 실패");
            }
        }

        function renderEntries(entries) {
            const container = document.getElementById("guestbook-entries");
            container.innerHTML = "";
            entries.forEach(entry => {
                const div = document.createElement("div");
                div.className = "entry";
                div.innerHTML = `
                    <div class="name">${escapeHtml(entry.name)}</div>
                    <div>${escapeHtml(entry.message)}</div>
                    <div class="date">${entry.date}</div>
                `;
                container.appendChild(div);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        loadEntries();
    </script>

</body>
</html>
