<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방명록</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .guestbook-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .guestbook-form input, .guestbook-form textarea { padding: 10px; font-size: 16px; }
        .guestbook-form button { padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .entry { border-bottom: 1px solid #ccc; padding: 10px 0; }
        .entry img { max-width: 100%; height: auto; margin-top: 10px; display: block; border-radius: 5px; }
        .entry .name { font-weight: bold; margin-bottom: 5px; }
        .entry .date { font-size: 12px; color: #888; }
    </style>
</head>
<body>

    <h2>방명록</h2>

    <div class="guestbook-form">
        <input type="text" id="username" placeholder="이름">
        <textarea id="message" rows="3" placeholder="메시지를 입력하세요"></textarea>
        <button onclick="addEntry()">작성하기</button>
    </div>

    <div id="guestbook-entries"></div>

    <script>
        const SERVER_URL = "https://jsonbin.org/me/guestbook"; // 실시간 연동 서버 주소

        async function loadEntries() {
            try {
                const res = await fetch(SERVER_URL);
                if (res.ok) {
                    const data = await res.json();
                    renderEntries(data);
                }
            } catch (e) {
                console.error("데이터 로드 실패:", e);
            }
        }

        async function addEntry() {
            const name = document.getElementById("username").value.trim();
            const message = document.getElementById("message").value.trim();

            if (!name || !message) {
                alert("이름과 메시지를 입력해주세요.");
                return;
            }

            const newEntry = {
                name: name,
                message: message,
                date: new Date().toLocaleString()
            };

            try {
                const res = await fetch(SERVER_URL);
                let entries = res.ok ? await res.json() : [];
                if (!Array.isArray(entries)) entries = [];

                entries.unshift(newEntry);

                await fetch(SERVER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(entries)
                });

                document.getElementById("username").value = "";
                document.getElementById("message").value = "";
                renderEntries(entries);
            } catch (e) {
                alert("저장에 실패했습니다.");
            }
        }

        function renderEntries(entries) {
            const container = document.getElementById("guestbook-entries");
            container.innerHTML = "";
            entries.forEach(entry => {
                const div = document.createElement("div");
                div.className = "entry";
                div.innerHTML = `
                    <div class="name">${escapeHtml(entry.name)}</div>
                    <div>${escapeHtml(entry.message)}</div>
                    <div class="date">${entry.date}</div>
                `;
                container.appendChild(div);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        loadEntries();
    </script>

</body>
</html>
